<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ed">
  <title>My Study · Dashboard</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='5' y='5' width='54' height='54' rx='17' fill='%23222820'/%3E%3Cpath d='M20 45V19h13a9 9 0 0 1 0 18H20m15 0 10 8' fill='none' stroke='%23e6f1dd' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f3ed;
      --card: #fffefa;
      --ink: #20231f;
      --muted: #777b72;
      --line: #e7e5dc;
      --green: #dff0e5;
      --lav: #e9e6f4;
      --orange: #f6e6d4;
      --shadow: 0 18px 55px #34392d0b
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif
    }

    a {
      color: inherit;
      text-decoration: none
    }

    .shell {
      width: min(1400px, 100%);
      height: 100dvh;
      margin: 0 auto;
      padding: clamp(20px, 5vh, 52px) 30px;
      display: flex;
      flex-direction: column
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .brand {
      display: flex;
      gap: 11px;
      align-items: center;
      font-weight: 700;
      letter-spacing: -.03em
    }

    .brand-mark {
      width: 13px;
      height: 13px;
      border: 2px solid #50614f;
      border-radius: 4px;
      transform: rotate(45deg)
    }

    .topnote {
      font-size: 13px;
      color: var(--muted)
    }

    .intro {
      margin: auto 0;
      max-width: 720px
    }

    .kicker {
      text-transform: uppercase;
      letter-spacing: .15em;
      color: #7b8174;
      font-size: 11px;
      font-weight: 700
    }

    .intro h1 {
      font-size: clamp(42px, 6.3vw, 70px);
      letter-spacing: -.075em;
      line-height: .99;
      font-weight: 560;
      margin: 13px 0 14px
    }

    .intro p {
      font-size: 16px;
      color: var(--muted);
      max-width: 570px;
      margin: 0
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      margin-bottom: 14px
    }

    .section-head h2 {
      font-size: 15px;
      letter-spacing: -.02em;
      margin: 0
    }

    .section-head span {
      font-size: 12px;
      color: var(--muted)
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px
    }

    .card {
      --tint: var(--green);
      display: flex;
      flex-direction: column;
      min-height: 245px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      box-shadow: var(--shadow);
      transition: transform .2s, border-color .2s
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #c9d2c6
    }

    .card:nth-child(2) {
      --tint: var(--lav)
    }

    .card:focus-visible {
      outline: 3px solid #8aab90;
      outline-offset: 3px
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .icon {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: var(--tint);
      color: #4f6250
    }

    .icon svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .card:nth-child(2) .icon {
      color: #605a82
    }

    .tag {
      font-size: 10px;
      letter-spacing: .05em;
      color: #687064;
      background: #f4f4ef;
      padding: 6px 10px;
      border-radius: 100px
    }

    .card h3 {
      font-size: 24px;
      letter-spacing: -.05em;
      margin: 22px 0 5px;
      font-weight: 620
    }

    .card p {
      color: var(--muted);
      margin: 0;
      max-width: 390px;
      font-size: 13px
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 20px
    }

    .meta {
      font-size: 11px;
      color: #858a80
    }

    .open {
      font-size: 12px;
      font-weight: 650;
      display: flex;
      gap: 7px;
      align-items: center
    }

    .footer {
      display: flex;
      justify-content: space-between;
      margin-top: 28px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 11px;
      color: #8b8e85
    }

    @media(max-width:680px) {
      .shell {
        padding: 22px 18px
      }

      .topnote {
        font-size: 12px
      }

      .intro {
        margin: auto 0
      }

      .intro h1 {
        font-size: 48px
      }

      .intro p {
        font-size: 14px
      }

      .cards {
        grid-template-columns: 1fr;
        gap: 10px
      }

      .card {
        min-height: 180px;
        padding: 16px
      }

      .card h3 {
        font-size: 20px;
        margin: 12px 0 4px
      }

      .card-bottom {
        padding-top: 12px
      }

      .section-head {
        margin-bottom: 10px
      }

      .footer {
        margin-top: 16px;
        padding-top: 10px;
        font-size: 9px
      }
    }

    @media(max-height:680px) and (min-width:681px) {
      .shell {
        padding-top: 18px;
        padding-bottom: 18px
      }

      .intro h1 {
        font-size: 48px
      }

      .card {
        min-height: 190px
      }

      .intro {
        margin: 20px 0
      }

      .footer {
        margin-top: 16px
      }
    }
    .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .card:nth-child(3) { --tint: var(--orange); }
    .card:nth-child(3) .icon { color: #8a6540; }
    .planned { background: #f8f6f0; box-shadow: none; border-style: dashed; }
    @media (max-width: 1250px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 860px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 680px) {
      .cards { grid-template-columns: 1fr; gap: 8px; }
      .card { min-height: 0; padding: 13px 15px; }
      .card-top { margin-bottom: 8px; }
      .card h3 { font-size: 19px; margin: 0 0 3px; }
      .card p { font-size: 12px; }
      .card-bottom { padding-top: 8px; }
    }
  </style>
</head>

<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="My Study home"><span class="brand-mark" aria-hidden="true"></span><span>My
          Study</span></a>
      <div class="topnote"><span class="dot" aria-hidden="true"></span> Your learning space</div>
    </header>
    <section class="intro" aria-labelledby="welcome">
      <div class="kicker">A little progress, every day</div>
      <h1 id="welcome">Make room<br>to learn.</h1>
      <p>Your study spaces, gathered in one place. Pick up where you left off, or jump into something new.</p>
    </section>
    <section aria-labelledby="spaces-title">
      <div class="section-head">
        <h2 id="spaces-title">Your study spaces</h2><span id="space-count"></span>
      </div>
      <div class="cards" id="spaces"></div>
    </section>
    <footer class="footer"><span>MY STUDY · PERSONAL DASHBOARD</span><span>One step at a time.</span></footer>
  </main>
  <script>
    // Add future study areas to this list; each card links to its folder's index.html.
    const studySpaces = [
      { title: 'Deep Learning Contest 2', description: 'Theory, numericals and MCQ practice across seven deep learning units.', folder: 'deep-learning-contest-2', label: 'DEEP LEARNING', icon: 'neural', detail: '7 units · quizzes · numericals' },
      { title: 'MCA EndSem', description: 'A complete revision hub for digital logic, computer architecture and MIPS.', folder: 'mca-endsem', label: 'Modern Computer Architecture', icon: 'computer', detail: 'Lectures · code · practice' },
      { title: 'CN EndSem', description: 'Computer Networks notes and exam revision in one place.', folder: 'cn-endsem', label: 'COMPUTER NETWORKS', icon: 'network', detail: 'Lectures · quizzes · numericals' },
      { title: 'AML EndSem', description: 'Advanced Machine Learning notes and exam revision across 16 lectures.', folder: 'aml-endsem', label: 'MACHINE LEARNING', icon: 'neural', detail: '16 lectures · code · practice hub' }
    ];
    const container = document.querySelector('#spaces');
    const icons = {
      neural: '<svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><path d="m7.7 7.3 2.9 3.4m5.7-3.4-2.9 3.4m-3.4 2-2.9 3.4m7.2-3.4 2.9 3.4"/></svg>',
      computer: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4m-5-9 3-3-3-3m6 6h4"/></svg>',
      network: '<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="m10.8 7.2-4.5 8.6m6.9-8.6 4.5 8.6M7.5 18h9"/></svg>'
    };
    const escapeHtml = value => String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    container.innerHTML = studySpaces.map(space => {
      const href = './' + encodeURIComponent(space.folder).replace(/%2F/gi, '/') + '/index.html';
      const planned = space.ready === false;
      const tag = planned ? 'COMING SOON' : escapeHtml(space.label);
      const card = `<div class="card-top"><span class="icon" aria-hidden="true">${icons[space.icon]}</span><span class="tag">${tag}</span></div><h3>${escapeHtml(space.title)}</h3><p>${escapeHtml(space.description)}</p><div class="card-bottom"><span class="meta">${escapeHtml(space.detail)}</span>${planned ? '' : '<span class="open">Open space <span aria-hidden="true">→</span></span>'}</div>`;
      return planned
        ? `<article class="card planned" aria-label="${escapeHtml(space.title)}, coming soon">${card}</article>`
        : `<a class="card" href="${href}">${card}</a>`;
    }).join('');
    document.querySelector('#space-count').textContent = `${studySpaces.filter(space => space.ready !== false).length} active · ${studySpaces.filter(space => space.ready === false).length} planned`;
  </script>
</body>

</html>
